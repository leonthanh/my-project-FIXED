name: Deploy to cPanel

# Playwright tests are disabled for automatic runs (team request) — use manual workflow for E2E when needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  EMAIL_USER: ${{ secrets.EMAIL_USER }}
  EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
  EMAIL_TO: ${{ secrets.EMAIL_TO }}
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_NAME: ${{ secrets.DB_NAME }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASS: ${{ secrets.DB_PASS }}
  REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
  VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
  VITE_FACEBOOK_APP_ID: ${{ secrets.VITE_FACEBOOK_APP_ID }}
  VITE_ZALO_APP_ID: ${{ secrets.VITE_ZALO_APP_ID }}
  VITE_ZALO_REDIRECT_URI: ${{ secrets.VITE_ZALO_REDIRECT_URI }}
  GOOGLE_CLIENT_IDS: ${{ secrets.GOOGLE_CLIENT_IDS }}
  FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
  FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
  ZALO_APP_ID: ${{ secrets.ZALO_APP_ID }}
  ZALO_APP_SECRET: ${{ secrets.ZALO_APP_SECRET }}

concurrency:
  group: deploy-to-cpanel
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      frontend-changed: ${{ steps.detect.outputs.frontend_changed }}
      backend-changed: ${{ steps.detect.outputs.backend_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect deploy targets
        id: detect
        run: |
          set -euo pipefail
          frontend_changed=false
          backend_changed=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            frontend_changed=true
            backend_changed=true
            echo "Manual dispatch: deploy both backend and frontend."
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"

            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
                base="$(git rev-parse HEAD^)"
              else
                frontend_changed=true
                backend_changed=true
                echo "Unable to resolve previous commit, deploy both targets for safety."
              fi
            fi

            if [ "$frontend_changed" = false ] || [ "$backend_changed" = false ]; then
              changed_files="$(git diff --name-only "$base" "$head" || true)"
              echo "Changed files:"
              echo "$changed_files"

              if echo "$changed_files" | grep -Eq '^(frontend/|\.github/workflows/deploy\.yml$)'; then
                frontend_changed=true
              fi

              if echo "$changed_files" | grep -Eq '^(backend/|utils/|\.github/workflows/deploy\.yml$)'; then
                backend_changed=true
              fi
            fi
          fi

          echo "frontend_changed=$frontend_changed" >> "$GITHUB_OUTPUT"
          echo "backend_changed=$backend_changed" >> "$GITHUB_OUTPUT"
          echo "Detected targets -> frontend=$frontend_changed backend=$backend_changed"
      - name: Create frontend artifact
        if: steps.detect.outputs.frontend_changed == 'true'
        run: |
          set -e
          cd frontend
          zip -r ../frontend-artifact.zip \
            package.json package-lock.json index.html public src \
            vite.config.mjs postcss.config.js tailwind.config.js || true
      - name: Create backend artifact
        if: steps.detect.outputs.backend_changed == 'true'
        run: |
          set -e
          cd backend
          # Include backend files and both backend/utils and repo-root utils so helpers like readingScorer are deployed
          zip -r ../backend-artifact.zip \
            server.js db.js logger.js routes models middlewares modules scripts package.json package-lock.json \
            utils ../utils || true
      - name: Upload artifacts
        if: steps.detect.outputs.frontend_changed == 'true' || steps.detect.outputs.backend_changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: deploy-artifacts
          path: |
            frontend-artifact.zip
            backend-artifact.zip

  frontend:
    needs:
      - prepare
      - backend
    runs-on: ubuntu-latest
    steps:
      - name: Skip frontend deploy (no frontend changes)
        if: needs.prepare.outputs.frontend-changed != 'true'
        run: echo "No frontend changes detected. Skipping frontend deploy."
      - name: Download artifacts
        if: needs.prepare.outputs.frontend-changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: deploy-artifacts
          path: .
      - name: Unpack frontend
        if: needs.prepare.outputs.frontend-changed == 'true'
        run: |
          unzip -o frontend-artifact.zip -d frontend || true
      - name: Setup Node.js
        if: needs.prepare.outputs.frontend-changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install lftp
        if: needs.prepare.outputs.frontend-changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
      - name: Install & Build Frontend
        if: needs.prepare.outputs.frontend-changed == 'true'
        run: |
          cd frontend
          echo "VITE_API_URL=${{ env.REACT_APP_API_URL }}" > .env.production
          echo "VITE_GOOGLE_CLIENT_ID=${{ env.VITE_GOOGLE_CLIENT_ID }}" >> .env.production
          echo "VITE_FACEBOOK_APP_ID=${{ env.VITE_FACEBOOK_APP_ID }}" >> .env.production
          echo "VITE_ZALO_APP_ID=${{ env.VITE_ZALO_APP_ID }}" >> .env.production
          echo "VITE_ZALO_REDIRECT_URI=${{ env.VITE_ZALO_REDIRECT_URI }}" >> .env.production
          echo "VITE_TEST_TIMER_GRACE_SECONDS=0" >> .env.production
          cp .env.production .env
          npm ci --prefer-offline --no-audit --no-progress || exit 1
          npm run build --no-progress || exit 1
        env:
          CI: false
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Deploy Frontend
        if: needs.prepare.outputs.frontend-changed == 'true'
        env:
          FTP_HOST: ftp.star-siec.edu.vn
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" <<'LFTP_CMDS'
          set cmd:fail-exit true
          set net:max-retries 5
          set net:timeout 40
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          set ftp:passive-mode true
          set ssl:verify-certificate no
          mkdir -p /ix.star-siec.edu.vn/frontend/build/
          mirror -R --continue --delete --verbose=1 --parallel=1 \
            -x '(^|/).*\.map$' \
            -x '(^|/).*\.txt$' \
            -x '(^|/)LICENSE$' \
            -x '(^|/).*\.webp$' \
            -x '(^|/).*\.svg$' \
            frontend/dist/ /ix.star-siec.edu.vn/frontend/build/
          bye
          LFTP_CMDS
            then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Frontend deploy failed after $attempt attempts."
              exit 1
            fi

            echo "Frontend deploy attempt $attempt failed. Retrying in 15 seconds..."
            sleep 15
          done

  backend:
    needs:
      - prepare
    runs-on: ubuntu-latest
    steps:
      - name: Skip backend deploy (no backend changes)
        if: needs.prepare.outputs.backend-changed != 'true'
        run: echo "No backend changes detected. Skipping backend deploy."
      - name: Download artifacts
        if: needs.prepare.outputs.backend-changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: deploy-artifacts
          path: .
      - name: Unpack backend
        if: needs.prepare.outputs.backend-changed == 'true'
        run: |
          unzip -o backend-artifact.zip -d backend-temp || true
      - name: Setup Node.js
        if: needs.prepare.outputs.backend-changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
      - name: Install lftp
        if: needs.prepare.outputs.backend-changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
      - name: Prepare backend package
        if: needs.prepare.outputs.backend-changed == 'true'
        run: |
          set -e
          # Rate-limit tuning for production peaks (3 campuses). Allow secret override,
          # otherwise use safe defaults to reduce 429 during weekend rush.
          api_rate_limit_max="2400"
          api_runtime_sync_rate_limit_max="7200"
          api_rate_limit_window_ms="60000"

          # Build .env from GitHub Secrets (never use committed env files)
          echo "NODE_ENV=production" > backend-temp/.env
          echo "PORT=5000" >> backend-temp/.env
          echo "DB_HOST=${{ env.DB_HOST }}" >> backend-temp/.env
          echo "DB_NAME=${{ env.DB_NAME }}" >> backend-temp/.env
          echo "DB_USER=${{ env.DB_USER }}" >> backend-temp/.env
          echo "DB_PASS=${{ env.DB_PASS }}" >> backend-temp/.env
          echo "EMAIL_USER=${{ env.EMAIL_USER }}" >> backend-temp/.env
          echo "EMAIL_PASS=${{ env.EMAIL_PASS }}" >> backend-temp/.env
          echo "EMAIL_TO=${{ env.EMAIL_TO }}" >> backend-temp/.env
          echo "REACT_APP_API_URL=${{ env.REACT_APP_API_URL }}" >> backend-temp/.env
          echo "GOOGLE_CLIENT_IDS=${{ env.GOOGLE_CLIENT_IDS }}" >> backend-temp/.env
          echo "FACEBOOK_APP_ID=${{ env.FACEBOOK_APP_ID }}" >> backend-temp/.env
          echo "FACEBOOK_APP_SECRET=${{ env.FACEBOOK_APP_SECRET }}" >> backend-temp/.env
          echo "ZALO_APP_ID=${{ env.ZALO_APP_ID }}" >> backend-temp/.env
          echo "ZALO_APP_SECRET=${{ env.ZALO_APP_SECRET }}" >> backend-temp/.env
          echo "OPENAI_API_KEY=${{ env.OPENAI_API_KEY }}" >> backend-temp/.env
          echo "OPENAI_FEEDBACK_MODEL=gpt-5.4-mini" >> backend-temp/.env
          echo "JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}" >> backend-temp/.env
          echo "JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}" >> backend-temp/.env
          echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> backend-temp/.env
          echo "API_RATE_LIMIT_MAX=$api_rate_limit_max" >> backend-temp/.env
          echo "API_RUNTIME_SYNC_RATE_LIMIT_MAX=$api_runtime_sync_rate_limit_max" >> backend-temp/.env
          echo "API_RATE_LIMIT_WINDOW_MS=$api_rate_limit_window_ms" >> backend-temp/.env
          echo "API_RUNTIME_SYNC_RATE_LIMIT_WINDOW_MS=$api_rate_limit_window_ms" >> backend-temp/.env
          echo "✅ Rate-limit config: API_RATE_LIMIT_MAX=$api_rate_limit_max, API_RUNTIME_SYNC_RATE_LIMIT_MAX=$api_runtime_sync_rate_limit_max, API_RATE_LIMIT_WINDOW_MS=$api_rate_limit_window_ms"
          echo "✅ .env built from GitHub Secrets"

          # Copy utils/ (if present at repo root) into package so modules like readingScorer are deployed
          if [ -d "utils" ]; then
            cp -r utils backend-temp/utils
            echo "✅ Copied utils into backend-temp"
          fi

          # Also copy backend/utils into package (some projects keep helpers inside backend/)
          if [ -d "backend/utils" ]; then
            cp -r backend/utils backend-temp/utils
            echo "✅ Copied backend/utils into backend-temp"
          fi

          ls -la backend-temp || true
      - name: Deploy Backend
        if: needs.prepare.outputs.backend-changed == 'true'
        env:
          FTP_HOST: ftp.star-siec.edu.vn
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          deploy_timeout=180
          for attempt in 1 2 3; do
            echo "Backend deploy attempt $attempt/3"
            if timeout "$deploy_timeout" lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" <<'LFTP_CMDS'
          set cmd:fail-exit true
          set net:max-retries 1
          set net:timeout 20
          set net:reconnect-interval-base 3
          set net:reconnect-interval-max 8
          set net:persist-retries 0
          set ftp:passive-mode true
          set ssl:verify-certificate no
          mkdir -p /ix.star-siec.edu.vn/backend/
          mirror -R --continue --delete --verbose=1 --parallel=1 \
            -x '(^|/)(node_modules|uploads)(/|$)' \
            -x '(^|/).*\.map$' \
            -x '(^|/).*\.md$' \
            backend-temp/ /ix.star-siec.edu.vn/backend/
          bye
          LFTP_CMDS
            then
              break
            fi

            status=$?
            if [ "$status" -eq 124 ]; then
              echo "Backend deploy attempt $attempt timed out after ${deploy_timeout}s."
            else
              echo "Backend deploy attempt $attempt failed with exit code $status."
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Backend deploy failed after $attempt attempts."
              exit 1
            fi

            echo "Backend deploy attempt $attempt failed. Retrying in 15 seconds..."
            sleep 15
          done
      - name: Notify Manual Restart
        if: needs.prepare.outputs.backend-changed == 'true'
        run: |
          echo "✅ Backend đã được deploy lên cPanel."
          echo "📌 Nếu backend vừa thêm package mới, vào cPanel → Setup Node.js App → chọn app → nhấn Run NPM Install trước."
          echo "📌 Sau đó nhấn Restart để khởi động lại server với dependencies mới nhất."

      - name: Post-deploy smoke check (non-blocking)
        if: needs.prepare.outputs.backend-changed == 'true'
        run: |
          echo "⏱️ Running post-deploy smoke check (non-blocking) against /api/reading-tests"
          set +e
          status=$(curl -s -o /dev/null -w "%{http_code}" https://ix.star-siec.edu.vn/api/reading-tests || echo "000")
          echo "Smoke check HTTP status: $status"
          if [ "$status" = "200" ]; then
            echo "✅ Smoke check OK"
          else
            echo "⚠️ Smoke check returned $status. If you just restarted the app, wait a few seconds and re-run checks."
          fi
          set -e
