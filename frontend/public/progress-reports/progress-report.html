<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Star Edu Progress Report System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@600;700&display=swap">
<style>
/* Layout: report-header band, skill tabs, then a two-column workbench — the 3-step formula on the left, the live comment sheet on the right (stacks on phones). Colors follow the navy/teal of the printed report forms. */
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --surface-2:#F7F9FB; --ink:#15263A; --muted:#5A6A7C; --line:#D7E0E9;
  --navy:#12365A; --navy-ink:#FFFFFF; --teal:#1B7472; --teal-soft:#E2F1F0; --warn:#A85A12; --warn-soft:#FBF0E4;
  --good:#2D7A4C; --good-soft:#E5F3EA; --prog:#1F5FA3; --prog-soft:#E5EEF9; --weak:#A8650A; --weak-soft:#FAF0DF; --spec:#76479A; --spec-soft:#F1E9F7;
  --f-display:"Lora",Georgia,"Times New Roman",serif; --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1620; --surface:#16212D; --surface-2:#1B2836; --ink:#E4EBF2; --muted:#98A8B9; --line:#2A3A4B;
  --navy:#1C4A75; --navy-ink:#FFFFFF; --teal:#5BC2BE; --teal-soft:#183533; --warn:#F0A65E; --warn-soft:#3A2A18;
  --good:#6FCB94; --good-soft:#18301F; --prog:#7FB2EE; --prog-soft:#172A40; --weak:#E9B04F; --weak-soft:#352812; --spec:#C49BE6; --spec-soft:#2B1F38; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1620; --surface:#16212D; --surface-2:#1B2836; --ink:#E4EBF2; --muted:#98A8B9; --line:#2A3A4B;
  --navy:#1C4A75; --navy-ink:#FFFFFF; --teal:#5BC2BE; --teal-soft:#183533; --warn:#F0A65E; --warn-soft:#3A2A18;
  --good:#6FCB94; --good-soft:#18301F; --prog:#7FB2EE; --prog-soft:#172A40; --weak:#E9B04F; --weak-soft:#352812; --spec:#C49BE6; --spec-soft:#2B1F38; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{font-size:15px}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.band{background:var(--navy);color:var(--navy-ink)}
header.band .wrap{padding-block:16px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 20px;align-items:start}
header.band .meta{grid-column:1/-1}
.org{font-size:.72rem;font-weight:700;letter-spacing:.09em;color:#CFE0F5;margin-bottom:4px}
.logo{height:74px;width:auto;background:#fff;border-radius:10px;padding:6px 10px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
@media (max-width:560px){.logo{height:44px;padding:4px 7px}}
.btn-ghost.danger{border-color:rgba(255,160,160,.6);color:#FFD6D6}
.btn-ghost.danger:hover{background:rgba(215,36,46,.35)}
.brand h1{font-family:var(--f-display);font-size:1.45rem;margin:0;letter-spacing:.01em;text-wrap:balance}
.brand p{margin:2px 0 0;font-size:.82rem;opacity:.78}
.meta{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.meta label{display:flex;flex-direction:column;gap:3px;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;opacity:.9}
.meta input,.meta select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:7px;padding:6px 9px;min-width:0;font-size:.9rem;text-transform:none;letter-spacing:0}
.meta input{width:190px}
.meta input::placeholder{color:rgba(255,255,255,.55)}
.meta select option{color:#15263A}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:7px;padding:6px 12px;cursor:pointer;font-size:.85rem}
.btn-ghost:hover{background:rgba(255,255,255,.12)}

nav.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:12px 14px 10px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:8px;align-items:center}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--teal)}
nav.tabs .en{font-size:.75rem;opacity:.7;font-weight:400}
.dot{min-width:20px;height:20px;border-radius:10px;background:var(--teal-soft);color:var(--teal);font-size:.72rem;font-weight:700;display:inline-grid;place-items:center;padding:0 6px}
.dot.zero{background:var(--surface-2);color:var(--muted)}

main .wrap{padding-block:20px 48px}
.bench{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.bench{grid-template-columns:minmax(0,1fr)}}

.setup{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.85rem;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.sit button[data-s="good"][aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.sit button[data-s="prog"][aria-pressed="true"]{background:var(--prog);border-color:var(--prog);color:#fff}
.sit button[data-s="weak"][aria-pressed="true"]{background:var(--weak);border-color:var(--weak);color:#fff}
.sit button[data-s="spec"][aria-pressed="true"]{background:var(--spec);border-color:var(--spec);color:#fff}
:root:not([data-theme="light"]) .sit button[aria-pressed="true"]{color:#0E1620}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .sit button[aria-pressed="true"]{color:#fff}}
:root[data-theme="light"] .sit button[aria-pressed="true"]{color:#fff}
.score{display:flex;gap:8px;align-items:center}
.score input{width:72px;border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--surface);font-variant-numeric:tabular-nums}
.grade{font-size:.8rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}

.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.step-h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.step-t{display:flex;gap:10px;align-items:baseline}
.step-n{font-family:var(--f-display);font-weight:700;color:var(--teal);font-size:1.15rem}
.step-t h3{margin:0;font-size:.98rem;font-weight:600}
.step-t small{color:var(--muted);font-size:.8rem}
.groups{display:flex;flex-wrap:wrap;gap:6px}
.groups button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 10px;cursor:pointer;font-size:.8rem;color:var(--muted)}
.groups button[aria-pressed="true"][data-g="good"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.groups button[aria-pressed="true"][data-g="prog"]{background:var(--prog-soft);border-color:var(--prog);color:var(--prog)}
.groups button[aria-pressed="true"][data-g="weak"]{background:var(--weak-soft);border-color:var(--weak);color:var(--weak)}
.groups button[aria-pressed="true"][data-g="spec"]{background:var(--spec-soft);border-color:var(--spec);color:var(--spec)}
.groups button[aria-pressed="true"][data-g="adv"],.groups button[aria-pressed="true"][data-g="tips"],.groups button[aria-pressed="true"][data-g="x"]{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.crit{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 0}
.crit .lbl{align-self:center;margin-right:4px}
.list{list-style:none;margin:0;padding:10px;display:grid;gap:6px}
.opt{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--ink);line-height:1.45}
.opt:hover{background:var(--surface-2);border-color:var(--line)}
.opt .box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.75rem;font-weight:700;color:transparent;margin-top:1px;font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{background:var(--teal-soft);border-color:var(--teal)}
.opt[aria-pressed="true"] .box{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.opt b{font-weight:600}
.opt .tag{font-size:.72rem;color:var(--muted);margin-left:6px;white-space:nowrap}
.ph{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:0 3px}
.add{display:flex;gap:8px;padding:0 16px 14px}
.add input{flex:1;min-width:0;border:1px dashed var(--line);border-radius:7px;padding:7px 10px;background:var(--surface)}
.add button,.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 12px;cursor:pointer;font-size:.85rem;white-space:nowrap}
.btn:hover,.add button:hover{border-color:var(--teal);color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--surface);font-weight:600}
.btn.primary:hover{filter:brightness(1.07);color:var(--surface)}
.empty{color:var(--muted);font-size:.86rem;padding:6px 10px 12px}

.sheet{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (max-width:900px){.sheet{position:static}}
.sheet-h{background:var(--navy);color:var(--navy-ink);padding:12px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sheet-h h2{font-family:var(--f-display);font-size:1.05rem;margin:0}
.sheet-h span{font-size:.78rem;opacity:.85}
.formula{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);font-size:.75rem;color:var(--muted)}
.formula i{font-style:normal;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.formula i.on{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);font-weight:600}
.sheet textarea{display:block;width:100%;min-height:230px;border:0;resize:vertical;padding:14px 16px;background:var(--surface);line-height:1.6;font-size:.95rem}
.sheet textarea:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--teal)}
.notice{margin:0 16px 10px;padding:8px 10px;border-radius:7px;font-size:.8rem;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.info{background:var(--prog-soft);color:var(--prog)}
.notice button{background:none;border:1px solid currentColor;color:inherit;border-radius:6px;padding:2px 8px;cursor:pointer;font-size:.78rem}
.sheet-f{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.sheet-f .meta-s{font-size:.78rem;color:var(--muted)}
.sel{border-top:1px solid var(--line)}
.sel-h{padding:10px 16px 2px;font-size:.78rem;font-weight:600;color:var(--ink)}
.sel-h small{font-weight:400;color:var(--muted);margin-left:6px}
.picked{list-style:none;margin:0;padding:6px 10px 12px;display:grid;gap:4px}
.picked li{border:1px solid var(--line);border-radius:7px;padding:6px 6px;background:var(--surface);cursor:grab}
.picked li.dragging{opacity:.4}
.picked li.over-top{box-shadow:inset 0 3px 0 var(--teal)}
.picked li.over-bot{box-shadow:inset 0 -3px 0 var(--teal)}
.picked .grip{color:var(--muted);letter-spacing:-2px;font-size:.8rem;line-height:1.5;user-select:none}
.picked .tx2{flex:1;min-width:0;color:var(--ink)}
.picked .mv{display:flex;gap:0;align-items:flex-start}
.picked .mv button:disabled{opacity:.25;cursor:default}
.picked li{display:flex;gap:8px;align-items:flex-start;font-size:.8rem;color:var(--muted)}
.picked button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:.9rem;line-height:1;padding:2px 4px}
.picked button:hover{color:var(--warn)}
.picked .k{font-weight:700;color:var(--teal);min-width:16px}
details.sel summary{cursor:pointer;padding:8px 16px;font-size:.8rem;color:var(--muted);border-top:1px solid var(--line)}

.summary{display:grid;gap:14px;max-width:880px}
.sum-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.sum-card h3{margin:0 0 6px;font-size:.95rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sum-card p{margin:0;white-space:pre-wrap;line-height:1.6}
.sum-card .none{color:var(--muted);font-style:italic}
.sum-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.sum-top h2{font-family:var(--f-display);margin:0;font-size:1.3rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.hint{font-size:.8rem;color:var(--muted);margin:0 0 14px}

.exp{min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 16px;padding:14px 16px}
.grid.att{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.ff{display:flex;flex-direction:column;gap:5px;min-width:0}
.ff input{border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--surface);min-width:0;width:100%}
.chk{display:flex;gap:6px;align-items:center;font-size:.85rem;cursor:pointer}
.sk-sum{list-style:none;margin:0;padding:8px 16px 12px;display:grid}
.sk-sum li{display:grid;grid-template-columns:minmax(80px,1fr) minmax(0,1.2fr) minmax(0,1.2fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.88rem;font-variant-numeric:tabular-nums}
.sk-sum li:last-child{border-bottom:0}
.sk-sum li span{color:var(--muted)}
.sk-sum li.avg b,.sk-sum li.avg span{color:var(--teal);font-weight:600}
.sk-sum.off,.grid.off,.parts.off{opacity:.4}
.sk-sum li span.over{color:var(--warn);font-weight:600}
.ff select{border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--surface);min-width:0;width:100%}
.parts{display:grid;padding:6px 16px 12px}
.prow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.prow:last-child{border-bottom:0}
.prow span{flex:1 1 220px;min-width:0}
.prow .seg button{width:36px;padding:5px 0;text-align:center;font-variant-numeric:tabular-nums}
.txs{display:grid;gap:14px;padding:14px 16px}
.tx-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.tx textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--surface);line-height:1.55;resize:vertical;min-height:96px}
.auto{font-size:.75rem;color:var(--teal)}
.link{background:none;border:0;color:var(--teal);cursor:pointer;font-size:.8rem;text-decoration:underline;padding:0}
.exp-body{padding:16px;display:grid;gap:12px}
.exp-body .notice{margin:0}
.exp-note{margin:0;font-size:.85rem;color:var(--muted)}
.btn.big{padding:11px 16px;font-size:.95rem;width:100%}
.btn:disabled{opacity:.6;cursor:progress}
.exp-status{margin:0;font-size:.85rem;color:var(--teal);min-height:1.2em}
.exp-status.warn{color:var(--warn)}
.paper{aspect-ratio:210/105;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:4px;padding:8% 9%;display:grid;gap:7px;align-content:start;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.paper-top{height:12px;border-radius:2px;background:linear-gradient(90deg,#153A80 0 18%,#CFE3F6 18% 100%);border-bottom:3px solid #D7242E;margin:-4% -4% 6%}
.paper-l{height:7px;border-radius:2px;background:#153A80;justify-self:center}.w60{width:55%}.w40{width:35%;opacity:.4}
.paper-t{height:16px;border-radius:2px;background:#EEF4FB;border:1px solid #C5D3E8}.paper-t.s{height:10px}
.paper-red{height:2px;background:#D7242E;width:30%;margin-top:4px}

.ovl{position:fixed;inset:0;background:rgba(10,20,35,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--surface);color:var(--ink);border-radius:12px;max-width:460px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;max-height:100%}
.dlg.wide{max-width:900px;height:100%;max-height:100%}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 6px}
.dlg-h h2{margin:0;font-family:var(--f-display);font-size:1.15rem}
.dlg-h .x{border:0;background:none;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--muted)}
.dlg-b{padding:4px 18px 12px;overflow:auto;min-height:0;flex:1}
.dlg-b>p{margin:6px 0;line-height:1.55;color:var(--muted)}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap;padding:12px 18px 16px;border-top:1px solid var(--line)}
.dlg-note{flex:1 1 240px;font-size:.8rem;color:var(--muted)}
.warnt{color:var(--warn)}
.btn.danger{background:#C62832;border-color:#C62832;color:#fff;font-weight:600}
.dlg.wide .dlg-b{background:var(--surface-2);padding:16px}
.pv-paper{background:#fff;color:#1A2433;max-width:794px;margin:0 auto;box-shadow:0 2px 10px rgba(0,0,0,.18);font-family:Verdana,"Be Vietnam Pro",Arial,sans-serif;font-size:12px;line-height:1.45}
.pv-top{aspect-ratio:1240/175;background-size:100% auto;background-position:top center;background-repeat:no-repeat}
.pv-bot{aspect-ratio:1240/150;background-size:100% auto;background-position:bottom center;background-repeat:no-repeat;margin-top:18px}
.pv-fallback{background:#153A80;color:#fff;font-weight:700;padding:14px 7%;font-size:13px;border-bottom:4px solid #D7242E}
.pv-body{padding:6px 7.1% 0}
.pv-body h1{text-align:center;color:#153A80;font-size:19px;margin:6px 0 2px;letter-spacing:.03em}
.pv-body .sub{text-align:center;font-style:italic;color:#5B6B85;margin-bottom:14px}
.pv-body h2{font-size:13px;color:#153A80;border-bottom:1.5px solid #D7242E;padding-bottom:3px;margin:16px 0 7px}
.pv-body h2 span{color:#D7242E}
.pv-body table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:inherit;color:inherit}
.pv-body td,.pv-body th{padding:5px 7px;vertical-align:middle;text-align:left;word-wrap:break-word}
.pv-body .info th{background:#EEF4FB;color:#153A80;font-size:10.5px;width:19%;border-bottom:1px solid #C5D3E8}
.pv-body .info td{border-bottom:1px solid #C5D3E8;width:31%}
.pv-body .tb td{border:1px solid #C5D3E8}
.pv-body .tb tr:nth-child(odd):not(.hd) td{background:#F7FAFD}
.pv-body .tb .hd td{background:#153A80;color:#fff;font-weight:700;font-size:11px;border-color:#153A80}
.pv-body .tb .tot td{background:#EEF4FB !important;color:#5B6B85}
.pv-body .tb i{color:#5B6B85;font-size:10.5px}
.pv-body p{margin:0 0 4px}
.pv-body .c{text-align:center}
.pv-body .sc{font-weight:700;color:#153A80;font-size:13px}

.pv-body .box{color:#153A80;font-size:14px}

.pv-body .phd{color:#9AAAC0;font-style:italic}
.pv-body mark{background:#FBE7C6;color:#8A4B0B;padding:0 2px}
.pv-body .sign{margin-top:20px}
.pv-body .sign td{text-align:center;vertical-align:top;color:#153A80}

.pv-num{position:absolute;right:10px;bottom:6px;font:11px/1 system-ui,sans-serif;color:#8A97A8}
.pv-body h1{margin-top:0}

    window.location.replace("/login");
  }
})();

function p(runs,o={}){

const bd=(c=LINE,sz=4)=>`<w:top w:val="single" w:sz="${sz}" w:space="0" w:color="${c}"/><w:left w:val="single" w:sz="${sz}" w:space="0" w:color="${c}"/><w:bottom w:val="single" w:sz="${sz}" w:space="0" w:color="${c}"/><w:right w:val="single" w:sz="${sz}" w:space="0" w:color="${c}"/>`;

function c(content,w,o={}){

  if(o.span) pr+=`<w:gridSpan w:val="${o.span}"/>`;

function tbl(widths,rows,o={}){
  const grid=widths.map(w=>`<w:gridCol w:w="${w}"/>`).join("");
  const sum=widths.reduce((a,b)=>a+b,0);
  if(o.together) rows=rows.map((rw,i)=>i<rows.length-1?{...rw,cells:rw.cells.map(x=>x.replace(/<w:pPr>/g,"<w:pPr><w:keepNext/>"))}:rw);
  return `<w:tbl><w:tblPr><w:tblW w:w="${sum}" w:type="dxa"/><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="0" w:type="dxa"/><w:right w:w="0" w:type="dxa"/></w:tblCellMar><w:tblLook w:val="0000"/></w:tblPr><w:tblGrid>${grid}</w:tblGrid>${rows.map(rw=>`<w:tr><w:trPr><w:cantSplit/>${rw.h?`<w:trHeight w:val="${rw.h}"/>`:""}${rw.header?"<w:tblHeader/>":""}</w:trPr>${rw.cells.join("")}</w:tr>`).join("")}</w:tbl>`;

const gap=(after=120)=>p("",{after,line:240});
function heading(n,text){

const th=(t,w,align="left")=>c(p(r(t,{b:true,color:"FFFFFF",sz:18}),{align}),w,{fill:NAVY,borders:bd(NAVY)});
function textBox(text,placeholder,minLines=3,keep=false){
  const lines=String(text||"").split(/\n+/).map(s=>s.trim()).filter(Boolean);
  let inner;
  if(lines.length) inner=lines.map((l,i)=>p(r(l,{sz:19,color:INK}),{after:i<lines.length-1?80:0,line:276})).join("");
  else inner=p(r(placeholder,{i:true,color:"9AAAC0",sz:18}),{line:276})+Array.from({length:minLines-1},()=>p("",{line:276})).join("");
  const t=tbl([W],[{cells:[c(inner,W,{fill:PALE,borders:bd(LINE),padV:110,v:"top"})]}]);
  return keep?t.replace(/<w:pPr>/g,"<w:pPr><w:keepNext/>"):t;

function multiBox(parts,placeholder){
  const seg=parts.filter(([h,t])=>String(t||"").trim());
  if(!seg.length) return textBox("",placeholder,3,true);
  const inner=seg.map(([h,t],k)=>{const ls=String(t).split(/\n+/).map(x=>x.trim()).filter(Boolean);
    return (h?p(r(h,{b:true,color:NAVY,sz:19}),{before:k?140:0,after:50,keepNext:true}):"")+ls.map((l,i)=>p(r(l,{sz:19,color:INK}),{after:i<ls.length-1?80:0,line:276})).join("");}).join("");
  return tbl([W],[{cells:[c(inner,W,{fill:PALE,borders:bd(LINE),padV:110,v:"top"})]}]);
}
const MSG_T="Lời nhắn đến học viên và phụ huynh";

function build(d){

    cuoi:[["Họ và tên học viên",d.student],["Lớp học",I.lop],["Chương trình",I.prog],["Giáo viên phụ trách",I.gv],["Ngày kiểm tra cuối khóa",I.ngaykt],["Khóa học tiếp theo",I.capdo]]

  const iw=[2050,3050,2050,3055], infoRows=[];
  const ib=`<w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="single" w:sz="4" w:space="0" w:color="${LINE}"/><w:right w:val="nil"/>`;
  for(let i=0;i<pairs.length;i+=2){
    const cell=(k,v,j)=>[c(p(r(k,{b:true,color:NAVY,sz:17})),iw[j],{fill:SOFT,borders:ib}),c(p(r(v||"",{sz:19,color:INK})),iw[j+1],{borders:ib})];
    infoRows.push({cells:[...cell(...pairs[i],0),...cell(...(pairs[i+1]||["",""]),2)]});
  }
  out.push(tbl(iw,infoRows)); out.push(gap(60));
  let n=0;
  // skills
  const INC=d.inc||{skills:true,att:true,part:true};

    d.skills.forEach((s,i)=>{
      const f=i%2?PALE:"FFFFFF";
      const com=String(s.comment||"").split(/\n+/).filter(Boolean);
      rows.push({cells:[
        c(p(r(s.name,{b:true,color:INK,sz:20}))+p(r(s.en,{i:true,color:MUTED,sz:16})),sw[0],{fill:f}),

    out.push(tbl(sw,rows));
  }
  // attendance
  if(INC.att){
  const A=d.att||{};

  const aw=[5000,1700,3505];

  out.push(tbl(aw,arows,{together:true}));
  }

  const pw=[4555,520,520,520,520,520,3050];

  const X=d.texts||{};

async function make(JSZip, templateBytes, data, type="blob"){
  const zip=await JSZip.loadAsync(templateBytes);
  let docXml=await zip.file("word/document.xml").async("string");
  const body=build(data);
  docXml=docXml.replace(/<w:body>[\s\S]*?(<w:sectPr)/, `<w:body>${body}$1`);
  zip.file("word/document.xml",docXml);
  const sty=zip.file("word/styles.xml");
  if(sty){let x=await sty.async("string");x=x.replace(/w:(ascii|hAnsi|cs|eastAsia)="Verdana"/g,'w:$1="Times New Roman"').replace(/w:asciiTheme="[^"]*"|w:hAnsiTheme="[^"]*"|w:eastAsiaTheme="[^"]*"|w:cstheme="[^"]*"/g,"");zip.file("word/styles.xml",x.replace(/<w:rFonts\s+\/>/g,'<w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman" w:eastAsia="Times New Roman"/>'));}
  let ct=await zip.file("[Content_Types].xml").async("string");
  zip.file("[Content_Types].xml",ct.replace("wordprocessingml.template.main+xml","wordprocessingml.document.main+xml"));
  const core=zip.file("docProps/core.xml");
  if(core){let x=await core.async("string");
    const title=esc(({thang:"Báo cáo tình hình học tập",giua:"Báo cáo giữa khóa",cuoi:"Báo cáo cuối khóa"}[data.type])+(data.student?" – "+data.student:""));
    x=/<dc:title>/.test(x)?x.replace(/<dc:title>[\s\S]*?<\/dc:title>/,`<dc:title>${title}</dc:title>`):x.replace("</cp:coreProperties>",`<dc:title>${title}</dc:title></cp:coreProperties>`);
    zip.file("docProps/core.xml",x);}
  return zip.generateAsync({type,mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",compression:"DEFLATE"});
}
return {build,make,MSG_T,planT};

 phanxa:{name:"Phản xạ",
 good:["Con phản xạ nhanh, trả lời câu hỏi của giáo viên ngay mà không cần suy nghĩ lâu.","Con trả lời bằng câu hoàn chỉnh và biết mở rộng câu trả lời bằng lý do, ví dụ.","Con chủ động đặt câu hỏi lại và duy trì được cuộc hội thoại với bạn và giáo viên.","Khi gặp câu hỏi lạ, con biết dùng các cụm như [Let me think..., Could you repeat that?] để xử lý tình huống tự nhiên."],
 prog:["Con đã mạnh dạn giơ tay phát biểu hơn, không còn ngại nói như [đầu khóa / tháng trước].","Thời gian suy nghĩ trước khi trả lời của con đã ngắn lại rõ rệt.","Con đã chuyển từ trả lời bằng một từ sang trả lời bằng câu ngắn hoàn chỉnh.","Con đã biết vận dụng các mẫu câu vừa học vào phần trả lời của mình."],
 weak:["Con hiểu câu hỏi nhưng cần nhiều thời gian để suy nghĩ và thường chỉ trả lời bằng một, hai từ.","Con còn dịch từ tiếng Việt sang tiếng Anh trong đầu trước khi nói nên câu nói chậm và hay ngắt quãng.","Con còn phụ thuộc vào gợi ý của giáo viên và chưa tự mở rộng câu trả lời.","Con hay chuyển sang tiếng Việt khi gặp từ không biết thay vì tìm cách diễn đạt khác."],
 spec:[["Rụt rè, ngại nói","Con nắm bài tốt [thể hiện qua bài đọc, viết] nhưng còn ngại nói trước lớp; giáo viên sẽ tăng hoạt động nói theo cặp, nhóm nhỏ để con tự tin dần."],["Lo sợ mắc lỗi","Con thường im lặng khi không chắc chắn đúng; giáo viên khuyến khích con hiểu rằng mắc lỗi là một phần bình thường của việc học."],["Nói nhiều nhưng chưa đúng chủ đề","Con rất sôi nổi, tuy nhiên cần lắng nghe câu hỏi kỹ hơn và nhường lượt cho bạn."],["Học thuộc lòng","Con nói trôi chảy các bài đã chuẩn bị sẵn nhưng lúng túng khi được hỏi câu khác đi; con cần luyện nói tự do nhiều hơn."]]},
 phatam:{name:"Phát âm",
 good:["Con phát âm rõ ràng, chính xác, người nghe dễ dàng hiểu được.","Con phát âm tốt các âm cuối [/s/, /z/, /t/, /d/] và các âm khó như [/θ/, /ð/, /ʃ/].","Con đặt trọng âm từ đúng, kể cả với các từ nhiều âm tiết.","Con biết tự sửa khi phát âm sai và bắt chước giọng mẫu rất tốt."],
 prog:["Con đã phát âm được âm cuối rõ hơn nhiều so với [đầu khóa], đặc biệt là âm /s/ ở danh từ số nhiều.","Con đã khắc phục được lỗi phát âm [âm ...] mà giáo viên đã nhắc trong [tháng trước].","Con đã chú ý đến trọng âm từ hơn, nói nghe tự nhiên hơn.","Con đã phân biệt được các cặp âm dễ nhầm như [/iː/ – /ɪ/ (sheep – ship)]."],
 weak:["Con còn hay bỏ âm cuối [ví dụ: cat đọc thành ca, books đọc thành book], khiến người nghe khó hiểu.","Con còn phát âm chưa chuẩn một số âm như [/θ/ thành /t/, /ʃ/ thành /s/, /r/ thành /z/].","Con còn đặt trọng âm sai ở một số từ quen thuộc như [banana, computer].","Con còn đọc theo mặt chữ (đọc như tiếng Việt) với các từ mới; con cần thói quen nghe phát âm mẫu trước khi đọc."],
 spec:[["Nói quá nhỏ","Con phát âm khá đúng nhưng nói rất nhỏ nên giáo viên và các bạn khó nghe; con cần tự tin nói to, rõ hơn."],["Nói quá nhanh","Con có xu hướng nói nhanh nên nuốt âm; con cần nói chậm lại để phát âm rõ từng từ."],["Ảnh hưởng giọng địa phương","Một số âm như [/l/ – /n/] của con còn bị ảnh hưởng bởi cách phát âm tiếng Việt; giáo viên sẽ luyện riêng cho con."],["Cần hỗ trợ chuyên môn","Con gặp khó khăn kéo dài với một số âm dù đã luyện nhiều; giáo viên xin phép trao đổi riêng với phụ huynh để cùng tìm cách hỗ trợ phù hợp."]]},
 ngudieu:{name:"Ngữ điệu",
 good:["Con nói với ngữ điệu tự nhiên, biết lên giọng ở câu hỏi Yes/No và xuống giọng ở câu trần thuật.","Con biết nhấn mạnh từ quan trọng trong câu và ngắt nghỉ đúng chỗ.","Con thể hiện được cảm xúc [vui, ngạc nhiên, hào hứng] qua giọng nói, khiến bài nói rất cuốn hút.","Con biết nối âm giữa các từ [ví dụ: pick it up], giúp câu nói trôi chảy như người bản xứ."],
 prog:["Giọng nói của con đã bớt đều đều, có lên xuống tự nhiên hơn so với [đầu khóa].","Con đã biết ngắt nghỉ theo cụm từ thay vì đọc từng từ một.","Con đã chú ý lên giọng khi đặt câu hỏi, giúp người nghe nhận ra ngay đó là câu hỏi."],
 weak:["Con còn nói đều đều một giọng, chưa phân biệt được ngữ điệu câu hỏi và câu trần thuật.","Con còn ngắt nghỉ sau mỗi từ nên câu nói chưa liền mạch.","Con còn nhấn đều tất cả các từ, chưa làm nổi bật được từ mang thông tin chính.","Khi kể chuyện hoặc thuyết trình, giọng con còn thiếu cảm xúc, chưa thu hút người nghe."],
 spec:[["Nói như đọc bài","Con có thói quen nói theo kiểu đọc thuộc lòng, ngữ điệu chưa giống giao tiếp thật; con cần luyện nói theo tình huống."],["Mang ngữ điệu tiếng Việt","Con còn đặt thanh điệu tiếng Việt vào từ tiếng Anh [ví dụ: nói yes thành yét]; giáo viên sẽ luyện nghe – nhắc lại với con thường xuyên."]]}},
 adv:["Con có thể thử thách bản thân với các hoạt động thuyết trình ngắn hoặc kể chuyện trước lớp.","Con nên tập dùng thêm các từ nối và cụm diễn đạt quan điểm [In my opinion..., For example...] để bài nói tự nhiên hơn."],
 tips:[["phanxa","Mỗi ngày trả lời 3–5 câu hỏi đơn giản bằng tiếng Anh với phụ huynh [What did you do today?] và tập mở rộng câu trả lời bằng [because...]."],["phatam","Tra phát âm từ mới bằng từ điển có audio [Cambridge, Oxford] và nhắc lại 3 lần; ghi âm giọng mình để tự so sánh."],["ngudieu","Luyện shadowing: nghe một đoạn hội thoại ngắn và nói theo ngay, bắt chước cả giọng lên xuống và chỗ ngắt nghỉ."]]},
doc:{name:"Đọc hiểu",en:"Reading",crit:{chung:{name:"Chung",
 good:["Con đọc hiểu tốt cả ý chính và thông tin chi tiết, làm bài Đọc với độ chính xác cao.","Con đọc nhanh, biết dùng kỹ năng đọc lướt (skimming) và đọc tìm thông tin (scanning) hiệu quả.","Con đoán được nghĩa của từ mới dựa vào ngữ cảnh mà không cần tra từ điển.","Con hiểu được cả ý ngầm, thái độ của tác giả và các câu hỏi suy luận.","Con có thói quen đọc thêm sách, truyện tiếng Anh ngoài giờ học, đây là nền tảng rất tốt cho con."],
 prog:["Điểm Đọc hiểu của con đã tăng từ [...] lên [...]; con đã hiểu bài đọc dài tốt hơn nhiều.","Con đã biết gạch chân từ khóa trong câu hỏi và tìm thông tin tương ứng trong bài.","Con đã không còn dừng lại ở từng từ mới mà biết đọc tiếp để hiểu ý cả đoạn.","Tốc độ đọc của con đã cải thiện, con hoàn thành bài đọc trong thời gian quy định.","Vốn từ vựng của con tăng lên rõ rệt, giúp con hiểu bài nhanh và chính xác hơn."],
 weak:["Con hiểu được các câu ngắn, đơn giản nhưng còn gặp khó khăn với đoạn văn dài.","Con còn đọc chậm, dịch từng từ sang tiếng Việt nên thường không đủ thời gian làm bài.","Con hay chọn đáp án có từ giống với bài đọc mà chưa kiểm tra nghĩa của cả câu.","Vốn từ vựng còn hạn chế, đặc biệt là từ vựng chủ đề [...], khiến con chưa hiểu được nội dung chính.","Con còn làm sai dạng bài True / False / Not Given (hoặc Yes / No) do chưa phân biệt rõ các lựa chọn."],
 spec:[["Làm bài vội vàng","Con có năng lực đọc tốt nhưng làm bài rất nhanh và ít kiểm tra lại nên mất điểm ở những câu không khó."],["Ngại đọc bài dài","Con có xu hướng bỏ qua hoặc đoán đáp án khi gặp bài đọc dài; giáo viên sẽ hướng dẫn con chia nhỏ bài để đọc."],["Khó khăn khi đọc chữ","Con còn đọc nhầm hoặc bỏ sót chữ, dòng khi đọc; giáo viên xin phép trao đổi riêng với phụ huynh để cùng theo dõi."],["Chênh lệch kỹ năng","Con giao tiếp khá tự tin nhưng kỹ năng Đọc còn thấp hơn các kỹ năng khác; con cần dành thêm thời gian đọc ở nhà."]]}},
 adv:["Con có thể thử đọc các truyện, bài báo ngắn ở cấp độ cao hơn để mở rộng vốn từ.","Con nên luyện thêm các câu hỏi suy luận và câu hỏi về mục đích của tác giả để chuẩn bị cho cấp độ tiếp theo."],
 tips:["Đọc mỗi ngày 15–20 phút truyện tranh hoặc sách phân cấp (graded readers) đúng trình độ.","Kể lại nội dung chính của bài đọc bằng 2–3 câu sau khi đọc.","Ghi từ mới vào sổ từ vựng kèm câu ví dụ lấy từ bài đọc.","Đọc câu hỏi trước, gạch chân từ khóa rồi tìm và đối chiếu từng câu với bài khi làm bài."]},
viet:{name:"Viết",en:"Writing",crit:{
 tuvung:{name:"Từ vựng",
 good:["Con sử dụng vốn từ vựng phong phú, đúng chủ đề và đúng ngữ cảnh.","Con biết dùng từ đồng nghĩa để tránh lặp từ, khiến bài viết sinh động hơn.","Con mạnh dạn sử dụng từ vựng và cụm từ mới vừa học trong [Unit ...].","Con viết đúng chính tả hầu hết các từ, kể cả từ dài và khó.","Con dùng tốt tính từ, trạng từ để miêu tả chi tiết, sinh động."],
 prog:["Vốn từ của con đã phong phú hơn rõ rệt, con ít lặp lại những từ đơn giản như [good, nice, very] hơn trước.","Lỗi chính tả của con đã giảm nhiều so với [đầu khóa / tháng trước].","Con đã biết dùng các từ nối như [first, then, because, however] để liên kết câu.","Con đã vận dụng được từ vựng của bài học vào bài viết thay vì chỉ dùng từ quen thuộc."],
 weak:["Vốn từ của con còn hạn chế, con hay lặp lại một số từ quen thuộc trong bài.","Con còn sai chính tả ở các từ đã học như [...]; con cần luyện viết lại từ vựng thường xuyên.","Con còn dùng từ chưa đúng ngữ cảnh do dịch trực tiếp từ tiếng Việt [ví dụ: open the light thay vì turn on the light].","Con còn nhầm loại từ, ví dụ dùng danh từ thay cho tính từ [ví dụ: I am happiness]."],
 spec:[["Lạm dụng công cụ dịch","Bài viết ở nhà của con có dấu hiệu sử dụng công cụ dịch / AI, từ vựng vượt xa trình độ trên lớp; giáo viên mong con tự viết để thầy cô nắm đúng năng lực và hỗ trợ con."],["Chép bài mẫu","Con còn chép nguyên câu từ bài mẫu; con cần tập diễn đạt lại bằng lời của mình dù câu còn đơn giản."],["Chữ viết khó đọc","Nội dung bài của con khá tốt nhưng chữ viết còn khó đọc, ảnh hưởng đến điểm số; con cần viết cẩn thận, rõ ràng hơn."]]},
 nguphap:{name:"Ngữ pháp",
 good:["Con sử dụng ngữ pháp chính xác, bài viết hầu như không có lỗi sai.","Con vận dụng tốt cấu trúc ngữ pháp vừa học, ví dụ [thì quá khứ đơn / so sánh hơn / câu điều kiện], vào bài viết.","Con biết kết hợp câu đơn và câu phức, giúp bài viết đa dạng và mạch lạc.","Con biết tự kiểm tra và sửa lỗi ngữ pháp trước khi nộp bài."],
 prog:["Con đã khắc phục được lỗi [chia động từ ngôi thứ ba số ít / thiếu động từ to be] mà con hay mắc trước đây.","Con đã biết viết câu hoàn chỉnh có đủ chủ ngữ và động từ.","Con đã bắt đầu dùng câu phức với [because, when, if] thay vì chỉ viết câu đơn.","Số lỗi ngữ pháp trong bài viết của con đã giảm rõ rệt so với [đầu khóa]."],
 weak:["Con còn hay quên chia động từ theo chủ ngữ [ví dụ: She like...] và theo thì.","Con còn viết câu thiếu động từ hoặc thiếu chủ ngữ [ví dụ: My mother very kind].","Con còn nhầm lẫn các thì [hiện tại đơn và hiện tại tiếp diễn / quá khứ đơn và hiện tại hoàn thành].","Con còn sắp xếp trật tự từ theo tiếng Việt [ví dụ: a dress red].","Con còn quên viết hoa đầu câu và dùng dấu câu chưa đúng."],
 spec:[["Giỏi lý thuyết, yếu vận dụng","Con làm bài tập ngữ pháp rất tốt nhưng khi viết đoạn văn vẫn mắc lỗi; con cần luyện viết tự do nhiều hơn."],["Ngại viết dài","Con chỉ viết 2–3 câu ngắn để tránh mắc lỗi nên bài chưa đạt số từ yêu cầu; giáo viên khuyến khích con mạnh dạn viết nhiều hơn."],["Chưa hoàn thành bài viết ở nhà","Con chưa nộp [...] bài viết trong tháng; phụ huynh vui lòng nhắc con hoàn thành để được giáo viên chữa bài."]]},
 bocuc:{name:"Bố cục",
 good:["Bài viết của con có bố cục rõ ràng (mở bài – thân bài – kết bài), ý tưởng phong phú và trả lời đủ các yêu cầu của đề."],
 prog:["Con đã biết lập dàn ý trước khi viết nên bài mạch lạc và đúng trọng tâm hơn."],
 weak:["Con còn viết lạc đề hoặc bỏ sót ý mà đề bài yêu cầu; con cần đọc kỹ đề và gạch chân các ý cần viết."],
 spec:[]}},
 adv:["Con có thể thử viết các bài dài hơn với nhiều dạng câu phức và từ vựng nâng cao.","Con nên luyện thêm cách viết đoạn mở bài và kết bài ấn tượng để bài viết có chiều sâu hơn."],
 tips:[["tuvung","Học 5 từ mới mỗi ngày, viết mỗi từ trong một câu của riêng mình và ôn lại bằng flashcard cuối tuần."],["nguphap","Ghi lại các lỗi hay mắc vào một trang riêng và xem lại trước mỗi lần viết."],["bocuc","Viết nhật ký ngắn 3–5 câu mỗi ngày, hoặc một đoạn văn [80–100] từ mỗi tuần theo chủ đề bài học."],["*","Đọc lại bài trước khi nộp và kiểm tra 4 điểm: viết hoa, dấu câu, chia động từ, chính tả."]]}
};
const GEN = {
 open:["Trong [tháng / nửa đầu khóa / khóa học] vừa qua, con đã có nhiều cố gắng đáng ghi nhận.","Giáo viên rất vui khi thấy con ngày càng tự tin và hứng thú hơn với môn tiếng Anh.","Con là học viên chăm chỉ, luôn hoàn thành tốt nhiệm vụ được giao.","Kết quả kiểm tra [giữa khóa / cuối khóa] cho thấy con đã nắm vững phần lớn kiến thức trọng tâm của chương trình."],
 att:[["Tích cực","Con luôn hăng hái tham gia các hoạt động, hòa đồng với bạn bè và lễ phép với thầy cô."],["Có tinh thần tự học","Con chủ động hỏi lại những phần chưa hiểu và tự ôn tập ở nhà rất tốt."],["Cần tập trung hơn","Con tiếp thu nhanh nhưng đôi khi còn mất tập trung, nói chuyện riêng trong giờ học."],["Cần chăm chỉ hơn","Con chưa hoàn thành đầy đủ bài tập về nhà, ảnh hưởng đến việc củng cố kiến thức."],["Cần đảm bảo chuyên cần","Con vắng [...] buổi và đi trễ [...] lần trong [tháng / khóa], khiến con bị hổng một số kiến thức quan trọng."]],
 end:[["*","Giáo viên tin rằng với sự cố gắng hiện tại, con sẽ tiếp tục tiến bộ trong thời gian tới."],["*","Rất mong phụ huynh tiếp tục đồng hành, nhắc nhở con ôn bài và hoàn thành bài tập về nhà đều đặn."],["*","Phụ huynh vui lòng liên hệ giáo viên / trung tâm nếu cần trao đổi thêm về tình hình học tập của con."],["giua","Giáo viên sẽ tiếp tục theo dõi và hỗ trợ con tập trung cải thiện kỹ năng [...] trong nửa khóa còn lại."],["cuoi","Con đã sẵn sàng cho cấp độ [...]; phụ huynh nên cho con duy trì việc tiếp xúc với tiếng Anh trong thời gian nghỉ giữa hai khóa."],["cuoi","Con cần thêm thời gian củng cố trước khi lên cấp độ mới; giáo viên đề xuất [học lại cấp độ / tham gia lớp bổ trợ kỹ năng ...] để con theo kịp chương trình."]]
};
const SIT = {good:"Học tốt",prog:"Tiến bộ nhiều",weak:"Chưa tốt, cần cố gắng",spec:"Có vấn đề đặc biệt"};
const GNAME = {good:"Học tốt",prog:"Tiến bộ nhiều",weak:"Chưa tốt",spec:"Vấn đề đặc biệt",adv:"Thử thách nâng cao"};
const DEF = {good:{g1:"good",g2:"adv"},prog:{g1:"prog",g2:"weak"},weak:{g1:"prog",g2:"weak"},spec:{g1:"prog",g2:"spec"}};
const ALL = ["nghe","noi","doc","viet"];
const PROG = {fp:{name:"FingerPrints",skills:["nghe","noi"]},eu:{name:"Everybody Up",skills:["nghe","noi","viet"]},ew:{name:"English World",skills:ALL},pr:{name:"Prepare",skills:ALL}};
let ORDER = ALL.slice();
function syncOrder(){ORDER=(PROG[S.program]||{}).skills||ALL; if(ALL.includes(S.tab)&&!ORDER.includes(S.tab)) S.tab=ORDER[0];}
const progName=()=>(PROG[S.program]||{}).name||"";
function scoreNum(v){const m=String(v??"").replace(",",".").match(/\d+(\.\d+)?/);return m?parseFloat(m[0]):NaN;}
function totalScore(){const v=ORDER.map(k=>scoreNum(S.skills[k].score)).filter(n=>!isNaN(n));if(!v.length)return "";return String(Math.round(v.reduce((a,b)=>a+b,0)*10)/10);}
const RNAME = {thang:"Hàng tháng",giua:"Giữa khóa",cuoi:"Cuối khóa"};

/* ---------- Trạng thái ---------- */
const KEY="nhanxet-v1";
function blank(){
  const s={student:"",pronoun:"Con",rtype:"thang",program:"",tab:"nghe",skills:{},gen:{sel:[],custom:{},override:null},rep:blankRep()};
  ALL.forEach(k=>{const c=Object.keys(SK[k].crit)[0];
    s.skills[k]={score:"",sit:null,crit:c,g1:"good",g2:"weak",sel:{1:[],2:[],3:[]},custom:{},override:null};});
  return s;
}
let S=blank();
try{const raw=localStorage.getItem(KEY); if(raw){const o=JSON.parse(raw); if(o&&o.skills) S=Object.assign(blank(),o);} }catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- Tra cứu câu ---------- */
function getText(skill,id){
  const sk=skill==="gen"?S.gen:S.skills[skill];
  if(id.startsWith("c:")) return sk.custom[id]||"";
  const p=id.split("|");
  if(skill==="gen"){const arr=GEN[p[0]],it=arr[+p[1]];return Array.isArray(it)?it[1]:it;}
  const [crit,g,i]=p, S0=SK[skill];
  if(g==="adv") return S0.adv[+i];
  if(g==="tips"){const t=S0.tips[+i];return Array.isArray(t)?t[1]:t;}
  const it=S0.crit[crit][g][+i]; return Array.isArray(it)?it[1]:it;
}
function idGroup(id){if(id.startsWith("c:"))return "x";const p=id.split("|");return p[1];}

/* ---------- Ghép câu ---------- */
const lowerFirst=t=>t?t.charAt(0).toLocaleLowerCase("vi")+t.slice(1):t;
const stripEnd=t=>t.replace(/[.\s]+$/,"");
const endDot=t=>/[.!?…]$/.test(t.trim())?t.trim():t.trim()+".";
function applyPronoun(text){
  const p=S.pronoun, name=S.student.trim();
  let rep = p==="__name" ? (name||"Con") : p;
  return text.replace(/(^|[^\p{L}])([Cc])on(?!\p{L})/gu,(m,pre,c)=>{
    if(p==="__name"&&name) return pre+name;
    return pre+(c==="C"?rep:rep.toLocaleLowerCase("vi"));
  });
}
function compose(skill){
  const sk=S.skills[skill], parts=[];
  const s1=sk.sel[1].map(id=>endDot(getText(skill,id)));
  if(s1.length) parts.push(s1.join(" "));
  const s2=sk.sel[2];
  if(s2.length){
    const first=s2[0], isAdv=idGroup(first)==="adv";
    const lead = s1.length ? (isAdv?"Bên cạnh đó, ":"Tuy nhiên, ") : "";
    const txt=s2.map((id,i)=>{const t=endDot(getText(skill,id)); return i===0&&lead?lead+lowerFirst(t):t;});
    parts.push(txt.join(" "));
  }
  const s3=sk.sel[3];
  if(s3.length){
    const lead = sk.sit==="good" ? "Để phát huy hơn nữa, con nên " : "Để cải thiện, con nên ";
    parts.push(lead+s3.map(id=>lowerFirst(stripEnd(getText(skill,id)))).join("; ")+".");
  }
  return applyPronoun(parts.join(" "));
}
function composeGen(){
  const g=S.gen; return applyPronoun(g.sel.map(id=>endDot(getText("gen",id))).join(" "));
}
const outText=k=>k==="gen"?(S.gen.override??composeGen()):(S.skills[k].override??compose(k));
function grade(){return null;}
const scoreLabel=()=>S.rtype==='giua'?'Điểm thi giữa khóa':S.rtype==='cuoi'?'Điểm thi cuối khóa':'Điểm';
const countSel=k=>{const s=S.skills[k].sel;return s[1].length+s[2].length+s[3].length;};

/* ---------- Hiển thị ---------- */
const $=s=>document.querySelector(s);
const esc=t=>t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=t=>esc(applyPronoun(t)).replace(/\[[^\]]*\]/g,m=>`<span class="ph">${m}</span>`);

function renderTabs(){
  const items=ORDER.map(k=>[k,SK[k].name,SK[k].en,countSel(k)]).concat([["gen","Nhận xét chung","",S.gen.sel.length],["sum","Tổng hợp","",null],["xuat","Xuất báo cáo","",null]]);
  $("#tabs").innerHTML=items.map(([k,n,en,c])=>`<button role="tab" type="button" data-tab="${k}" aria-selected="${S.tab===k}">${n}${en?` <span class="en">${en}</span>`:""}${c!==null?` <span class="dot ${c?"":"zero"}">${c}</span>`:""}</button>`).join("");
}

function optBtn(skill,step,id,html,tag){
  const sk=skill==="gen"?S.gen:S.skills[skill];
  const arr=skill==="gen"?sk.sel:sk.sel[step];
  const pos=arr.indexOf(id);
  return `<li><button type="button" class="opt" data-skill="${skill}" data-step="${step}" data-id="${esc(id)}" aria-pressed="${pos>-1}"><span class="box">${pos>-1?pos+1:""}</span><span>${html}${tag?`<span class="tag">${tag}</span>`:""}</span></button></li>`;
}
function itemHtml(it){return Array.isArray(it)?`<b>${esc(it[0])}:</b> ${fmt(it[1])}`:fmt(it);}

function stepBlock(skill,step){
  const sk=S.skills[skill], S0=SK[skill], crit=sk.crit, multi=Object.keys(S0.crit).length>1;
  let title,sub,groups,g,items=[];
  if(step===1){title="Ghi nhận điểm tích cực";sub="luôn mở đầu bằng một điểm tốt";groups=["good","prog"];g=sk.g1;}
  else if(step===2){title="Chỉ ra điểm cần cải thiện";sub=sk.sit==="good"?"không bắt buộc với học viên học tốt":"chọn 1 điểm cụ thể";groups=["weak","spec","adv"];g=sk.g2;}
  else {title="Gợi ý cách luyện tập";sub="hành động cụ thể tại nhà";groups=null;g="tips";}
  if(step===3){
    S0.tips.forEach((t,i)=>{const c=Array.isArray(t)?t[0]:"*"; if(multi&&c!=="*"&&c!==crit&&crit!=="__all")return;
      items.push(optBtn(skill,3,`${crit}|tips|${i}`.replace(/^[^|]+/,"t"),fmt(Array.isArray(t)?t[1]:t),multi&&c!=="*"?S0.crit[c].name:""));});
  } else if(g==="adv"){
    S0.adv.forEach((t,i)=>items.push(optBtn(skill,step,`a|adv|${i}`,fmt(t))));
  } else {
    (S0.crit[crit][g]||[]).forEach((t,i)=>items.push(optBtn(skill,step,`${crit}|${g}|${i}`,itemHtml(t))));
  }
  // custom sentences for this step
  Object.keys(sk.custom).filter(id=>id.startsWith(`c:${step}:`)).forEach(id=>items.push(optBtn(skill,step,id,fmt(sk.custom[id]),"câu riêng")));
  return `<section class="step">
    <div class="step-h"><div class="step-t"><span class="step-n">${step}</span><div><h3>${title}</h3><small>${sub}</small></div></div>
    ${groups?`<div class="groups" role="group" aria-label="Nhóm câu">${groups.map(x=>`<button type="button" data-g="${x}" data-skill="${skill}" data-gstep="${step}" aria-pressed="${g===x}">${GNAME[x]}</button>`).join("")}</div>`:""}</div>
    ${items.length?`<ul class="list">${items.join("")}</ul>`:`<p class="empty">Tiêu chí này chưa có câu ở nhóm «${GNAME[g]||""}». Chọn nhóm khác hoặc tự thêm câu bên dưới.</p>`}
    <form class="add" data-skill="${skill}" data-step="${step}"><input id="add-${skill}-${step}" placeholder="Thêm câu của riêng bạn..." aria-label="Thêm câu riêng bước ${step}"><button type="submit">Thêm</button></form>
  </section>`;
}

function sheet(key,title){
  const isGen=key==="gen", sk=isGen?S.gen:S.skills[key];
  const text=outText(key), phs=(text.match(/\[[^\]]*\]/g)||[]).length;
  const fresh=isGen?composeGen():compose(key), stale=sk.override!==null&&sk.override!==fresh;
  const steps=isGen?null:[1,2,3].map(n=>sk.sel[n].length>0);
  const picked=isGen?sk.sel.map(id=>[0,id]):[1,2,3].flatMap(n=>sk.sel[n].map(id=>[n,id]));
  const sc=!isGen&&sk.score?` · Điểm ${esc(sk.score)}${grade(sk.score)?" – "+grade(sk.score):""}`:"";
  return `<aside class="sheet" aria-label="Nhận xét">
    <div class="sheet-h"><h2>${title}</h2><span>${esc(S.student||"Học viên")}${sc}</span></div>
    ${steps?`<div class="formula"><i class="${steps[0]?"on":""}">① Tích cực</i><i class="${steps[1]?"on":""}">② Cần cải thiện</i><i class="${steps[2]?"on":""}">③ Luyện tập</i></div>`:""}
    <textarea id="out-${key}" data-out="${key}" aria-label="Đoạn nhận xét, có thể sửa trực tiếp" placeholder="Bấm chọn câu ở bên trái, đoạn nhận xét sẽ hiện ở đây. Bạn có thể sửa trực tiếp.">${esc(text)}</textarea>
    ${phs?`<div class="notice warn"><span>Còn ${phs} chỗ [...] cần điền thông tin cụ thể.</span></div>`:""}
    ${sk.override!==null?`<div class="notice info"><span>${stale?"Bạn đã sửa tay; lựa chọn mới chưa được đưa vào.":"Đang dùng bản bạn sửa tay."}</span><button type="button" data-regen="${key}">Tạo lại từ lựa chọn</button></div>`:""}
    ${picked.length?`<div class="sel"><div class="sel-h">Thứ tự câu <small>kéo thả hoặc dùng ↑↓ để sắp xếp${isGen?"":" trong từng bước"}</small></div><ul class="picked">${picked.map(([n,id],i)=>{const grp=isGen?sk.sel:sk.sel[n],pos=grp.indexOf(id);return `<li draggable="true" data-dk="${key}" data-dstep="${n}" data-did="${esc(id)}"><span class="grip" aria-hidden="true">⋮⋮</span><span class="k">${n||"•"}</span><span class="tx2">${fmt(getText(key,id))}</span><span class="mv"><button type="button" title="Lên" aria-label="Chuyển lên" data-mv="${key}" data-step="${n}" data-id="${esc(id)}" data-dir="-1" ${pos===0?"disabled":""}>↑</button><button type="button" title="Xuống" aria-label="Chuyển xuống" data-mv="${key}" data-step="${n}" data-id="${esc(id)}" data-dir="1" ${pos===grp.length-1?"disabled":""}>↓</button><button type="button" title="Bỏ câu này" aria-label="Bỏ câu này" data-rm="${key}" data-step="${n}" data-id="${esc(id)}">×</button></span></li>`;}).join("")}</ul></div>`:""}
    <div class="sheet-f"><span class="meta-s">${text.trim()?text.trim().split(/\s+/).length+" từ":"Chưa có nội dung"}</span>
      <div style="display:flex;gap:8px"><button class="btn" type="button" data-clear="${key}">Xóa tất cả</button><button class="btn primary" type="button" data-copy="${key}">Sao chép</button></div></div>
  </aside>`;
}

function renderSkill(k){
  const sk=S.skills[k], S0=SK[k], crits=Object.keys(S0.crit), gr=grade(sk.score);
  return `<div class="setup">
      <div class="field"><span class="lbl">Tình huống của học viên ở kỹ năng ${S0.name}</span>
        <div class="seg sit" role="group">${Object.keys(SIT).map(s=>`<button type="button" data-s="${s}" data-sit="${k}" aria-pressed="${sk.sit===s}">${SIT[s]}</button>`).join("")}</div></div>
      <div class="field"><label class="lbl" for="score-${k}">${scoreLabel()}</label>
        <div class="score"><input id="score-${k}" data-score="${k}" value="${esc(sk.score)}" placeholder="VD: 20" autocomplete="off">${gr?`<span class="grade">${gr}</span>`:""}</div></div>
    </div>
    ${sk.sit?"":`<p class="hint">Chọn tình huống để ứng dụng mở sẵn nhóm câu phù hợp ở từng bước. Bạn vẫn có thể đổi nhóm bất cứ lúc nào.</p>`}
    <div class="bench">
      <div>
        ${crits.length>1?`<div class="setup" style="padding:10px 16px"><div class="field"><span class="lbl">Tiêu chí</span><div class="seg" role="group">${crits.map(c=>`<button type="button" data-crit="${c}" data-skill="${k}" aria-pressed="${sk.crit===c}">${S0.crit[c].name}</button>`).join("")}</div></div><span class="hint" style="margin:0">Câu đã chọn được giữ lại khi chuyển tiêu chí, nên có thể nhận xét cả ${crits.map(c=>S0.crit[c].name.toLowerCase()).join(", ")} trong cùng một đoạn.</span></div>`:""}
        ${stepBlock(k,1)}${stepBlock(k,2)}${stepBlock(k,3)}
      </div>
      ${sheet(k,"Nhận xét kỹ năng "+S0.name)}
    </div>`;
}

function renderGen(){
  const sec=(key,title,sub,list)=>`<section class="step"><div class="step-h"><div class="step-t"><div><h3>${title}</h3><small>${sub}</small></div></div></div>
    <ul class="list">${list.map(([i,it,tag])=>optBtn("gen",0,`${key}|${i}`,itemHtml(it),tag)).join("")}
    ${Object.keys(S.gen.custom).filter(id=>id.startsWith(`c:${key}:`)).map(id=>optBtn("gen",0,id,fmt(S.gen.custom[id]),"câu riêng")).join("")}</ul>
    <form class="add" data-skill="gen" data-step="${key}"><input id="add-gen-${key}" placeholder="Thêm câu của riêng bạn..." aria-label="Thêm câu riêng"><button type="submit">Thêm</button></form></section>`;
  const ends=GEN.end.map((e,i)=>[i,e[1],e[0]==="*"?"":(e[0]==="giua"?"giữa khóa":"cuối khóa"),e[0]]).filter(x=>x[3]==="*"||x[3]===S.rtype||(S.rtype==="thang"&&false));
  return `<p class="hint">Dùng cho các mục Ưu điểm, Hạn chế và Lời nhắn đến phụ huynh. Câu kết đang lọc theo loại báo cáo: <b>${RNAME[S.rtype]}</b>.</p>
  <div class="bench"><div>
    ${sec("open","Câu mở đầu","đặt ở đầu phần nhận xét",GEN.open.map((t,i)=>[i,t,""]))}
    ${sec("att","Thái độ học tập","chuyên cần, tham gia, bài tập",GEN.att.map((t,i)=>[i,t,""]))}
    ${sec("end","Câu kết và lời nhắn phụ huynh","",ends.map(x=>[x[0],x[1],x[2]]))}
  </div>${sheet("gen","Nhận xét chung")}</div>`;
}

function renderSum(){
  const rows=ORDER.map(k=>{const sk=S.skills[k],t=outText(k).trim(),g=grade(sk.score);
    return `<div class="sum-card"><h3>${SK[k].name} <span class="en" style="color:var(--muted);font-weight:400;font-size:.8rem">${SK[k].en}</span>${sk.score?`<span class="grade">${esc(sk.score)}${g?" – "+g:""}</span>`:""}${sk.sit?`<span class="grade">${SIT[sk.sit]}</span>`:""}<span style="flex:1"></span>${t?`<button class="btn" type="button" data-copy="${k}">Sao chép</button>`:""}</h3>${t?`<p>${esc(t)}</p>`:`<p class="none">Chưa có nhận xét. Mở tab ${SK[k].name} để chọn câu.</p>`}</div>`;}).join("");
  const gt=outText("gen").trim();
  return `<div class="summary"><div class="sum-top"><h2>Báo cáo ${RNAME[S.rtype].toLowerCase()} · ${esc(S.student||"Học viên")}</h2><button class="btn primary" type="button" data-copyall="1">Sao chép tất cả</button></div>
  <p class="hint" style="margin:0">Dán từng đoạn vào cột «Nhận xét của giáo viên» trong bảng điểm các kỹ năng, nhận xét chung vào mục Ưu điểm / Lời nhắn.</p>
  ${rows}<div class="sum-card"><h3>Nhận xét chung<span style="flex:1"></span>${gt?`<button class="btn" type="button" data-copy="gen">Sao chép</button>`:""}</h3>${gt?`<p>${esc(gt)}</p>`:`<p class="none">Chưa có. Mở tab Nhận xét chung để chọn câu mở đầu, thái độ và câu kết.</p>`}</div></div>`;
}

function render(keepFocus){
  syncOrder();
  renderTabs();
  $("#student").value!==S.student&&($("#student").value=S.student);
  $("#pronoun").value=S.pronoun; $("#rtype").value=S.rtype; $("#program").value=S.program||"";
  const v=$("#view");
  const ae=document.activeElement, fid=ae&&ae.id, sel=ae&&ae.selectionStart;
  v.innerHTML = S.tab==="xuat"?renderExport():S.tab==="sum"?renderSum():S.tab==="gen"?renderGen():renderSkill(S.tab);
  if(keepFocus&&fid){const el=document.getElementById(fid); if(el&&v.contains(el)){el.focus(); try{el.setSelectionRange(sel,sel);}catch(e){}}}
  save();
}

/* ---------- Xuất báo cáo ---------- */
const PART=["Tích cực phát biểu, đặt câu hỏi trong giờ học","Hoàn thành bài tập về nhà đúng hạn","Hợp tác tốt trong hoạt động nhóm / cặp đôi","Thái độ học tập nghiêm túc, tập trung","Sử dụng tiếng Anh chủ động trong giờ học"];
const PLEVEL=["","Chưa đạt","Cần cải thiện","Đạt","Khá","Xuất sắc"];

function todayVN(){const d=new Date();return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;}

const capFirst=t=>t?t.charAt(0).toLocaleUpperCase("vi")+t.slice(1):t;
/* Ghép lại từ đoạn giáo viên đã sửa, để chỉ cần sửa một lần */
function phMap(fresh,edited){
  const map={}; if(edited==null||edited===fresh) return map;
  const re=/\[[^\]]*\]/g, parts=[]; let m,last=0;
  while((m=re.exec(fresh))){parts.push({lit:fresh.slice(last,m.index),ph:m[0]});last=m.index+m[0].length;}
  const tail=fresh.slice(last); let cur=0;
  parts.forEach((pt,i)=>{
    const before=pt.lit.slice(-24), nxt=i+1<parts.length?parts[i+1].lit:tail, after=nxt.slice(0,24);
    let st=before?edited.indexOf(before,cur):cur; if(st<0) return; st+=before.length;
    const en=after?edited.indexOf(after,st):edited.length; if(en<0) return;
    const rep=edited.slice(st,en); if(rep!==pt.ph&&!(pt.ph in map)) map[pt.ph]=rep; cur=en;
  });
  return map;
}
function segBy(pieces,edited){
  if(edited==null||edited===pieces.join(" ")) return pieces.slice();
  const pos=[]; let cur=0;
  for(const pc of pieces){const b=pc.indexOf("["), a=pc.slice(0,Math.min(14,b<0?14:b));
    if(a.trim().length<3) return null; const i=edited.indexOf(a,cur); if(i<0) return null; pos.push(i); cur=i+1;}
  return pos.map((st,i)=>edited.slice(st,i+1<pos.length?pos[i+1]:edited.length).trim());
}
const applyMap=(t,map)=>{let o=t;for(const [k,v] of Object.entries(map)) o=o.split(k).join(v);return o;};
const endDot2=t=>{t=t.trim();return !t||/[.!?…]$/.test(t)?t:t+".";};
function skillParts(k){
  const sk=S.skills[k], sent=id=>endDot(getText(k,id));
  const s1=sk.sel[1], s2=sk.sel[2], s3=sk.sel[3];
  const raw={p1:applyPronoun(s1.map(sent).join(" ")),
    p2:applyPronoun(s2.filter(id=>idGroup(id)!=="adv").map(sent).join(" ")),
    p2a:applyPronoun(s2.filter(id=>idGroup(id)==="adv").map(sent).join(" ")),
    p3:s3.length?applyPronoun(capFirst(s3.map(id=>lowerFirst(stripEnd(getText(k,id)))).join("; "))+"."):""};
  const ov=sk.override, fresh=compose(k);
  if(ov==null||ov===fresh) return raw;
  // 1) Tách theo từ nối của công thức: lấy nguyên phần giáo viên đã sửa
  let T=ov.trim(), p3="", ok=true;
  if(s3.length){const m=[...T.matchAll(/Để (?:cải thiện|phát huy hơn nữa), [^,.;]{1,40}? nên /g)].pop();
    if(m){p3=endDot2(capFirst(T.slice(m.index+m[0].length)));T=T.slice(0,m.index).trim();}else ok=false;}
  let p1="",p2="";
  if(ok){
    if(s1.length&&s2.length){const m=T.match(/(?:^|\s)(Tuy nhiên|Bên cạnh đó), /);
      if(m){p1=T.slice(0,m.index).trim();p2=capFirst(T.slice(m.index+m[0].length).trim());}else ok=false;}
    else if(s1.length) p1=T; else if(s2.length) p2=capFirst(T);
  }
  if(ok){const advFirst=s2.length&&idGroup(s2[0])==="adv";
    return {p1:endDot2(p1),p2:advFirst?"":endDot2(p2),p2a:advFirst?endDot2(p2):"",p3};}
  // 2) Không nhận ra từ nối: chỉ chuyển các chỗ [...] đã điền
  const map=phMap(fresh,ov); for(const x in raw) raw[x]=applyMap(raw[x],map); return raw;
}
function autoTexts(){
  const sent=id=>endDot(getText("gen",id));
  const lines={uu:[],han:[],ke:[]};
  const g=S.gen.sel, genOf=pfx=>g.filter(id=>id.startsWith(pfx+"|")||id.startsWith("c:"+pfx+":"));
  const gp=g.map(id=>applyPronoun(endDot(getText("gen",id)))), gseg=segBy(gp,S.gen.override), gmap=gseg?{}:phMap(composeGen(),S.gen.override);
  const GT=id=>{const i=g.indexOf(id);return gseg?gseg[i]:applyMap(gp[i],gmap);};
  const attPos=genOf("att").filter(id=>id.startsWith("c:")||+id.split("|")[1]<=1);
  const attNeg=genOf("att").filter(id=>!id.startsWith("c:")&&+id.split("|")[1]>=2);
  const head=[...genOf("open"),...attPos].map(GT).filter(Boolean).join(" ");
  if(head) lines.uu.push(head);
  if(attNeg.length) lines.han.push(attNeg.map(GT).filter(Boolean).join(" "));
  ORDER.forEach(k=>{const nm=SK[k].name, P=skillParts(k);
    if(P.p1) lines.uu.push(nm+": "+P.p1);
    if(P.p2) lines.han.push(nm+": "+P.p2);
    const kp=[P.p2a,P.p3].filter(Boolean); if(kp.length) lines.ke.push(nm+": "+kp.join(" "));
  });
  const end=genOf("end").map(GT).filter(Boolean).join(" ");
  const ke=lines.ke.join("\n");
  const loinhan = S.rtype==="thang" ? [ke?"Gợi ý luyện tập tại nhà:\n"+ke:"",end].filter(Boolean).join("\n") : end;
  return {uudiem:lines.uu.join("\n"),hanche:lines.han.join("\n"),kehoach:ke,loinhan};
}

function b64ToBytes(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
async function doExport(btn){
  const st=document.getElementById("exp-status");
  const say=(m,warn)=>{if(st){st.textContent=m;st.classList.toggle("warn",!!warn);}else toast(m);};
  if(typeof JSZip==="undefined"){say("Trình duyệt này không chạy được bộ tạo file. Hãy mở bằng Chrome, Edge, Safari hoặc Firefox bản mới.",true);return;}
  btn.disabled=true; say("Đang tạo file…");
  try{
    const blob=await DOCX.make(JSZip,b64ToBytes(TPL_B64),reportData());
    const nm=({thang:"Bao cao thang",giua:"Bao cao giua khoa",cuoi:"Bao cao cuoi khoa"})[S.rtype];
    const who=S.student.trim().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").replace(/[^\w\s-]/g,"").trim().replace(/\s+/g,"-");
    const res=await DL.save({filename:`${nm}${who?" - "+who:""}.docx`,data:blob});
    say("Đã tải file (xem trong thư mục Tải xuống / Downloads). Mở bằng Word để kiểm tra và chỉnh sửa trước khi gửi phụ huynh.");
    toast("Đã tạo báo cáo");
  }catch(e){
    const code=e&&e.code;
    if(code==="declined") say("Bạn đã hủy tải file.");
    else if(code==="rate_limited") say("Đang có một hộp thoại tải file mở. Đóng hộp thoại đó rồi thử lại.",true);
    else if(code&&["unavailable","not_granted","capability_disabled","capability_removed","extension_not_enabled"].includes(code)) say("Trang này hiện không được phép tải file.",true);
    else say("Không tạo được file: "+(e&&e.message||e),true);
  }finally{btn.disabled=false;}
}

function dialog(o,onOk){

  wrap.innerHTML=`<div class="dlg ${o.wide?"wide":""}" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><div class="dlg-h"><h2 id="dlg-t">${o.title}</h2>${o.wide?`<button type="button" class="x" data-close aria-label="Đóng">×</button>`:""}</div><div class="dlg-b">${o.html||`<p>${esc(o.body)}</p>`}</div><div class="dlg-f">${o.note?`<span class="dlg-note">${o.note}</span>`:""}${o.print?`<button type="button" class="btn" data-print>In / lưu PDF</button>`:""}<button type="button" class="btn" data-close>${o.cancel||"Hủy"}</button>${o.ok?`<button type="button" class="btn ${o.danger?"danger":"primary"}" data-ok>${o.ok}</button>`:""}</div></div>`;
  const close=()=>{wrap.remove();document.removeEventListener("keydown",key);};
  const key=e=>{if(e.key==="Escape")close();};
  wrap.addEventListener("click",e=>{if(e.target===wrap||e.target.closest("[data-close]"))close();else if(e.target.closest("[data-print]")){if(typeof window.print==="function")window.print();else toast("Trình duyệt này không hỗ trợ in hoặc lưu PDF.");}else if(e.target.closest("[data-ok]")){close();onOk&&onOk();}});
  document.addEventListener("keydown",key);document.body.appendChild(wrap);
  (wrap.querySelector("[data-ok]")||wrap.querySelector("[data-close]")).focus();
}

  if(INC.skills){h+=H("Kết quả kiểm tra các kỹ năng")+`<table class="tb"><tr class="hd"><td style="width:18%">Kỹ năng</td><td style="width:14%;text-align:center">${e(d.scoreLabel||"Điểm")}</td><td>Nhận xét của giáo viên</td></tr>${d.skills.map(s=>`<tr><td><b>${s.name}</b><br><i>${s.en}</i></td><td class="c sc">${e(s.score||"")}</td><td>${paras(s.comment)}</td></tr>`).join("")}<tr class="tot"><td><b>Tổng điểm</b></td><td class="c red">${d.total?d.total+"/100":""}</td><td><i>Cộng điểm các kỹ năng (thang 100)</i></td></tr></table>`;}
  if(INC.att){const A=d.att||{},L=[[d.type==="thang"?"Tổng số buổi học trong tháng":d.type==="giua"?"Tổng số buổi học đến giữa khóa":"Tổng số buổi học của cả khóa","tong"],["Số buổi học viên tham dự","thamdu"],["Vắng có phép","cophep"],["Vắng không phép","khongphep"],["Số lần đi trễ","tre"]];
    h+=H(d.type==="thang"?"Tình hình chuyên cần":d.type==="giua"?"Tình hình chuyên cần (tính đến giữa khóa)":"Tình hình chuyên cần (cả khóa học)")+`<table class="tb keep"><tr class="hd"><td>Hạng mục chuyên cần</td><td style="width:17%;text-align:center">Số buổi / lần</td><td style="width:34%">Ghi chú</td></tr>${L.map(([k,key])=>`<tr><td>${k}</td><td class="c sc">${e(A[key]??"")}</td><td></td></tr>`).join("")}</table>`;}
  if(INC.part){h+=H("Đánh giá mức độ tham gia học tập")+`<table class="tb keep"><tr class="hd"><td>Tiêu chí đánh giá</td>${[1,2,3,4,5].map(k=>`<td class="c" style="width:5%">${k}</td>`).join("")}<td style="width:30%">Ghi chú</td></tr>${PART.map((c,i)=>`<tr><td>${c}</td>${[1,2,3,4,5].map(k=>`<td class="c box">${(d.part||[])[i]===k?"☒":"☐"}</td>`).join("")}<td>${e((d.partNotes||[])[i]||"")}</td></tr>`).join("")}<tr class="tot"><td colspan="7"><i><b>Mức đánh giá:</b> 1 = Chưa đạt · 2 = Cần cải thiện · 3 = Đạt · 4 = Khá · 5 = Xuất sắc</i></td></tr></table>`;}
  const X=d.texts||{}, box=(t,phd)=>`<div class="tbox">${t&&t.trim()?paras(t):`<p class="phd">${phd}</p>`}</div>`;
  const mbox=(parts,phd)=>{const seg=parts.filter(([h,t])=>String(t||"").trim());return seg.length?`<div class="tbox">${seg.map(([h,t],k)=>`<p class="cap"${k?"":' style="margin-top:0"'}>${e(h)}</p>${paras(t)}`).join("")}</div>`:box("",phd);};
  if(d.type==="thang"){h+=H("Ưu điểm trong tháng")+box(X.uudiem,"Ghi nhận những tiến bộ…")+H("Hạn chế cần khắc phục")+box(X.hanche,"Nêu rõ những điểm học viên còn yếu…")+H(DOCX.MSG_T)+box(X.loinhan,"Nhắn nhủ riêng của giáo viên…");}
  else{h+=H("Ưu điểm nổi bật")+box(X.uudiem,"Ghi nhận những tiến bộ…")+H("Hạn chế cần cải thiện")+box(X.hanche,"Nêu cụ thể những điểm yếu…")+H(DOCX.MSG_T)+mbox([[DOCX.planT(d.type),X.kehoach],["Lời nhắn & nhắc nhở",X.loinhan]],"Kế hoạch học tập và lời nhắn riêng của giáo viên…");}
  h+=`<table class="sign"><tr><td><b>Xác nhận của phụ huynh</b><br><i>(Ký và ghi rõ họ tên)</i></td><td><i>Ngày lập báo cáo: ${e(I.ngaylap||"……/……/………")}</i><br><b>Giáo viên phụ trách</b><br><i>(Ký và ghi rõ họ tên)</i><div class="sgap"></div><b>${e(I.gv||"")}</b></td></tr></table>`;
  return h;
}
const PG={w:794,h:1123,top:113,bot:95,x:57};
function paginate(html,host,lh){
  const lim=PG.h-PG.top-PG.bot;
  const meas=document.createElement("div");meas.className="pv-body pv-measure";meas.style.width=(PG.w-2*PG.x)+"px";meas.innerHTML=html;host.appendChild(meas);
  const hOf=el=>{const cs=getComputedStyle(el);return el.getBoundingClientRect().height+parseFloat(cs.marginTop)+parseFloat(cs.marginBottom);};
  const pages=[[]];let used=0;const next=()=>{pages.push([]);used=0;};
  const kids=[...meas.children];
  kids.forEach((el,i)=>{
    let h=hOf(el);
    if(el.tagName==="H2"&&kids[i+1]){const nx=kids[i+1],nh=nx.classList.contains("keep")?hOf(nx):Math.min(hOf(nx),120);if(used+h+nh>lim&&used>0)next();}
    if(used+h<=lim||used===0&&h<=lim){pages[pages.length-1].push(el);used+=h;return;}
    if(el.tagName==="TABLE"&&el.rows.length>2&&!el.classList.contains("keep")){
      const rows=[...el.rows],head=rows[0].classList.contains("hd")?rows[0]:null,body=head?rows.slice(1):rows,hh=head?head.getBoundingClientRect().height:0;
      let chunk=[],ch=hh+4;const flush=()=>{if(!chunk.length)return;const t=el.cloneNode(false);if(head)t.appendChild(head.cloneNode(true));chunk.forEach(r=>t.appendChild(r.cloneNode(true)));pages[pages.length-1].push(t);used+=ch;chunk=[];ch=hh+4;};
      body.forEach(r=>{const rh=r.getBoundingClientRect().height;if(used+ch+rh>lim&&(chunk.length||used>0)){flush();next();}chunk.push(r);ch+=rh;});
      flush();return;
    }
    next();pages[pages.length-1].push(el);used+=h;
  });
  const out=pages.filter(p=>p.length).map(()=>{const pg=document.createElement("div");pg.className="pv-page";if(lh)pg.style.backgroundImage=`url('${lh}')`;else pg.classList.add("nolh");const b=document.createElement("div");b.className="pv-body pv-in";pg.appendChild(b);return pg;});
  pages.filter(p=>p.length).forEach((p,i)=>p.forEach(el=>out[i].firstChild.appendChild(el)));
  meas.remove();out.forEach((pg,i)=>{const n=document.createElement("span");n.className="pv-num";n.textContent=`Trang ${i+1}/${out.length}`;pg.appendChild(n);host.appendChild(pg);});
  return out.length;
}
async function openPreview(){
  const d=reportData(),lh=await letterhead(),html=previewHTML(d),phs=(html.match(/<mark>/g)||[]).length;
  dialog({wide:true,title:"Xem trước báo cáo",cancel:"Đóng",ok:"Tải báo cáo .docx",print:true,note:`<span id="pv-count"></span> Bố cục A4; bấm “In / lưu PDF” rồi chọn lưu dưới dạng PDF.${phs?` <b class="warnt">Còn ${phs} chỗ [...] chưa điền (tô vàng).</b>`:""}`,
    html:`<div class="pv-pages" id="pv-pages"></div>`},
    ()=>doExport(document.getElementById("do-export")||{disabled:false}));
  const host=document.getElementById("pv-pages");if(!host)return;
  const fit=()=>{const w=host.clientWidth;host.style.setProperty("--pvz",Math.min(1,(w-8)/PG.w));};fit();
  const n=paginate(html,host,lh);const c=document.getElementById("pv-count");if(c)c.innerHTML=`<b>${n} trang A4.</b>`;
  window.addEventListener("resize",fit,{once:true});
}

/* ---------- Kéo thả sắp xếp ---------- */
let DRAG=null;
function grpOf(k,step){return k==="gen"?S.gen.sel:S.skills[k].sel[+step];}
document.addEventListener("dragstart",e=>{const li=e.target.closest&&e.target.closest("li[data-did]");if(!li)return;
  DRAG={k:li.dataset.dk,step:li.dataset.dstep,id:li.dataset.did};li.classList.add("dragging");
  try{e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",DRAG.id);}catch(_){}});
document.addEventListener("dragend",e=>{document.querySelectorAll(".picked li").forEach(x=>x.classList.remove("dragging","over-top","over-bot"));DRAG=null;});
document.addEventListener("dragover",e=>{const li=e.target.closest&&e.target.closest("li[data-did]");if(!li||!DRAG)return;
  if(li.dataset.dk!==DRAG.k||li.dataset.dstep!==DRAG.step)return;
  e.preventDefault();const r=li.getBoundingClientRect(),top=e.clientY<r.top+r.height/2;
  document.querySelectorAll(".picked li").forEach(x=>x.classList.remove("over-top","over-bot"));li.classList.add(top?"over-top":"over-bot");});
document.addEventListener("drop",e=>{const li=e.target.closest&&e.target.closest("li[data-did]");if(!li||!DRAG)return;
  if(li.dataset.dk!==DRAG.k||li.dataset.dstep!==DRAG.step)return;e.preventDefault();
  const g=grpOf(DRAG.k,DRAG.step),from=g.indexOf(DRAG.id);if(from<0)return;
  const r=li.getBoundingClientRect(),after=e.clientY>=r.top+r.height/2;
  g.splice(from,1);let to=g.indexOf(li.dataset.did);if(to<0)to=g.length;else if(after)to++;
  g.splice(to,0,DRAG.id);DRAG=null;render();});

/* ---------- Sự kiện ---------- */
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),1800);}
async function copy(text,ta){
  try{await navigator.clipboard.writeText(text);toast("Đã sao chép");}
  catch(e){ if(ta){ta.focus();ta.select();} toast("Đã chọn sẵn đoạn văn, nhấn Ctrl/⌘ + C để sao chép"); }
}
function toggle(skill,step,id){
  const sk=skill==="gen"?S.gen:S.skills[skill];
  const arr=skill==="gen"?sk.sel:sk.sel[step];
  const i=arr.indexOf(id); i>-1?arr.splice(i,1):arr.push(id);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const d=b.dataset;
  if(d.tab){S.tab=d.tab;render();window.scrollTo({top:0});return;}
  if(b.id==="do-export"){doExport(b);return;}
  if(b.id==="do-preview"){openPreview();return;}
  if(d.part!==undefined){const i=+d.part,v=+d.v;S.rep.part[i]=S.rep.part[i]===v?0:v;render();return;}
  if(d.retext){S.rep.texts[d.retext]=null;render();return;}
  if(b.classList.contains("opt")){const was=b.getAttribute("aria-pressed")==="true";toggle(d.skill,+d.step||0,d.id);render();
    if(!was&&/\[[^\]]*\]/.test(getText(d.skill,d.id))) toast("Câu này có chỗ [...] — hãy thay bằng thông tin cụ thể của học viên");return;}
  if(d.sit){const sk=S.skills[d.sit];sk.sit=d.s;sk.g1=DEF[d.s].g1;sk.g2=DEF[d.s].g2;render();return;}
  if(d.g){const sk=S.skills[d.skill];sk["g"+d.gstep]=d.g;render();return;}
  if(d.crit){S.skills[d.skill].crit=d.crit;render();return;}
  if(d.regen){(d.regen==="gen"?S.gen:S.skills[d.regen]).override=null;render();return;}
  if(d.rm){toggle(d.rm,+d.step,d.id);render();return;}
  if(d.mv){const g=d.mv==="gen"?S.gen.sel:S.skills[d.mv].sel[+d.step],i=g.indexOf(d.id),j=i+(+d.dir);if(i<0||j<0||j>=g.length)return;[g[i],g[j]]=[g[j],g[i]];render();return;}
  if(d.clear){const sk=d.clear==="gen"?S.gen:S.skills[d.clear]; if(d.clear==="gen")sk.sel=[];else sk.sel={1:[],2:[],3:[]}; sk.override=null;render();toast("Đã xóa các câu đã chọn");return;}
  if(d.copy){copy(outText(d.copy),document.getElementById("out-"+d.copy));return;}
  if(d.copyall){
    const head=`BÁO CÁO ${RNAME[S.rtype].toUpperCase()}${S.student?" – "+S.student:""}${progName()?" – "+progName():""}`;
    const body=ORDER.map(k=>{const sk=S.skills[k],t=outText(k).trim();if(!t)return null;const g=grade(sk.score);
      return `${SK[k].name} (${SK[k].en})${sk.score?` – ${sk.score}${g?" – "+g:""}`:""}\n${t}`;}).filter(Boolean);
    const tot=totalScore(); if(tot) body.push("Tổng điểm: "+tot+"/100");
    const gt=outText("gen").trim(); if(gt) body.push("Nhận xét chung\n"+gt);
    copy([head,...body].join("\n\n"));return;}
});
document.getElementById("pv-btn").addEventListener("click",()=>openPreview());
document.getElementById("reset").addEventListener("click",()=>{
  dialog({title:"Tạo báo cáo mới?",body:"Thông tin lớp được giữ lại khi tạo báo cáo mới.",ok:"Tạo báo cáo mới"},()=>{
    const keep={pronoun:S.pronoun,rtype:S.rtype,program:S.program,tab:S.tab==='xuat'?'nghe':S.tab},oldRep=S.rep;S=blank();Object.assign(S,keep);S.rep=blankRep(oldRep);render();toast("Đã tạo báo cáo mới");});
});
document.getElementById("wipe").addEventListener("click",()=>{
  dialog({title:"Xóa toàn bộ nội dung?",body:"Toàn bộ nội dung đã nhập sẽ bị xóa, kể cả thông tin lớp, chương trình và giáo viên. Thao tác này không khôi phục được.",ok:"Xóa hết",danger:true},()=>{
    S=blank();S.rep=blankRep();render();toast("Đã xóa toàn bộ nội dung");});
});
document.addEventListener("submit",e=>{
  const f=e.target.closest("form.add"); if(!f) return; e.preventDefault();
  const inp=f.querySelector("input"), t=inp.value.trim(); if(!t) return;
  const skill=f.dataset.skill, step=f.dataset.step, id=`c:${step}:${Date.now()}`;
  const sk=skill==="gen"?S.gen:S.skills[skill]; sk.custom[id]=t;
  if(skill==="gen") sk.sel.push(id); else sk.sel[step].push(id);
  render(); toast("Đã thêm câu riêng");
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.out){const k=el.dataset.out;(k==="gen"?S.gen:S.skills[k]).override=el.value;save();
    clearTimeout(render.h);render.h=setTimeout(()=>render(true),700);return;}
  if(el.dataset.rep){const path=el.dataset.rep.split("."),last=path.pop();let o=S.rep;path.forEach(k=>o=o[k]);o[last]=el.value;save();
    clearTimeout(render.h);render.h=setTimeout(()=>render(true),600);return;}
  if(el.dataset.score){S.skills[el.dataset.score].score=el.value.trim();clearTimeout(render.h);render.h=setTimeout(()=>render(true),400);return;}
  if(el.id==="student"){S.student=el.value;save();clearTimeout(render.h);render.h=setTimeout(()=>render(true),400);}
});
document.addEventListener("change",e=>{const el=e.target;if(el.dataset&&el.dataset.inc){S.rep.inc[el.dataset.inc]=el.checked;render();}});
$("#pronoun").addEventListener("change",e=>{S.pronoun=e.target.value;render();});
$("#rtype").addEventListener("change",e=>{S.rtype=e.target.value;render();});
$("#program").addEventListener("change",e=>{S.program=e.target.value;render();});
document.addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.prog!==undefined){S.program=e.target.value;render();}});
